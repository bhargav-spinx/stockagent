name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install only what the tests import — NOT the full requirements.txt, which
      # pulls smartapi-python/telethon and can fail to install cleanly in CI.
      - name: Install test dependencies
        run: pip install pandas numpy pytz python-dotenv pytest
      - name: Run tests
        run: pytest tests/ -q
